name: Publish and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-npm:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-windows-exe:
    runs-on: windows-latest
    needs: publish-npm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare dist directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Bundle CLI for SEA
        run: npx --yes esbuild bin/cli.js --bundle --platform=node --format=cjs --outfile=dist/sln2csproj.sea.cjs

      - name: Create SEA blob
        shell: pwsh
        run: |
          @'
          {
            "main": "dist/sln2csproj.sea.cjs",
            "output": "dist/sln2csproj.blob",
            "disableExperimentalSEAWarning": true
          }
          '@ | Set-Content -Path sea-config.json -Encoding utf8
          node --experimental-sea-config sea-config.json

      - name: Build Windows executable
        shell: pwsh
        run: |
          $nodeExe = (Get-Command node).Source
          Copy-Item $nodeExe dist/sln2csproj-win-x64.exe
          npx --yes postject dist/sln2csproj-win-x64.exe NODE_SEA_BLOB dist/sln2csproj.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          Compress-Archive -Path dist/sln2csproj-win-x64.exe -DestinationPath dist/sln2csproj-win-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sln2csproj-win-x64
          path: |
            dist/sln2csproj-win-x64.exe
            dist/sln2csproj-win-x64.zip

      - name: Attach Windows release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sln2csproj-win-x64.exe
            dist/sln2csproj-win-x64.zip
